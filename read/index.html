<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>The Library has moved</title>
<style>body{font-family:Georgia,serif;background:#f6f1e7;color:#2b2520;margin:0}main{text-align:center;margin-top:22vh;padding:0 16px}h1{letter-spacing:.14em;font-weight:normal}a{color:#8a5a2b}</style></head>
<body><main><h1>THE LIBRARY</h1>
<p>The readers' site now lives at <a href="https://read.rainbowagama.com/">read.rainbowagama.com</a>. Taking you there&hellip;</p>
<p style="opacity:.7">Your shelf and notes come along; you will be asked for the password once more.</p></main>
<script>
// This page replaces the old readers' site at rainbowagama.com/library-canon-site/read/. A reader who
// already had a shelf here carries it over through their personal link (#me=<token>, kept in this
// origin's localStorage); a share link (#c=...) or the author's door (#author) passes through as is.
(function(){ var to='https://read.rainbowagama.com/', h=location.hash||'';
  if(!/^#(me=|c=|author)/.test(h)){ try{ var s=JSON.parse(localStorage.getItem('library-reader')||'null'); if(s&&s.token) h='#me='+s.token; }catch(e){} }
  location.replace(to+h); })();
</script></body></html>
